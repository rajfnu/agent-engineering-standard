name: validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate skills (structure, budgets, description quality, links)
        run: python3 tools/validate_skills.py skills

      - name: Validate repository (versions, manifests, links, measurements)
        run: python3 tools/validate_repo.py

      - name: Validate JSON manifests
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json .codex-plugin/plugin.json; do
            python3 -m json.tool "$f" > /dev/null && echo "ok: $f"
          done

      - name: Report context cost
        run: python3 tools/measure_context.py skills
